name: Build Aseprite
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Aseprite
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Skia
        run: |
          Invoke-WebRequest -Uri "https://github.com" -OutFile "skia.zip"
          Expand-Archive -Path "skia.zip" -DestinationPath "C:\deps\skia"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and Build
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLAF_BACKEND=skia -DSKIA_DIR=C:\deps\skia -DSKIA_LIBRARY_DIR=C:\deps\skia\out\Release-x64 -DSKIA_LIBRARY=C:\deps\skia\out\Release-x64\skia.lib -G Ninja ..
          ninja aseprite

      - name: Package Aseprite
        run: |
          mkdir Aseprite-Windows
          xcopy /E /I build\bin\* Aseprite-Windows\

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows
          path: Aseprite-Windows
